<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Área do Cliente • Ensaios Privados | PH Media</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7f7880">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=4.9">

  <style>
    .client-portal-shell {
      width: 100%;
      max-width: 960px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .client-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .client-login-card {
      max-width: 400px;
      margin: 48px auto;
      background: rgba(255, 255, 255, 0.78);
      border: 1.5px solid rgba(0, 0, 0, 0.14);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
    }

    .client-gallery-header {
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .client-photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .client-photo-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #18181b;
      aspect-ratio: 4 / 5;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    .client-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .client-photo-item:hover img {
      transform: scale(1.03);
    }

    .client-photo-actions {
      position: absolute;
      inset: auto 0 0 0;
      padding: 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78), transparent);
      display: flex;
      justify-content: flex-end;
    }

    .btn-download-single {
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body class="light-theme">

  <div class="client-portal-shell">
    <header class="client-topbar">
      <a href="index.html" class="brand-logo" aria-label="PH Media Início">
        <img src="assets/images/logo.png?v=3.6" alt="PH Media" class="logo-img" width="54" height="34">
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn-sm btn-glass">
          <i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i>
          <span>Voltar ao Site</span>
        </a>
      </div>
    </header>

    <!-- TELA DE LOGIN DO CLIENTE -->
    <section id="clientLoginSection" class="client-login-card">
      <div style="width: 54px; height: 54px; border-radius: 14px; background: #000; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px;">
        <i class="fa-solid fa-camera-retro"></i>
      </div>
      <h1 style="font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: #000; margin-bottom: 6px;">Área Exclusiva do Cliente</h1>
      <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 22px;">Digite o código do seu ensaio e a senha disponibilizados pela <strong>PH Media</strong>:</p>

      <form id="clientLoginForm" style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
        <div class="form-group">
          <label for="clientCodeInput">Código do Ensaio / Login</label>
          <div class="input-wrap">
            <i class="fa-solid fa-hashtag"></i>
            <input type="text" id="clientCodeInput" placeholder="Ex: ENSAIO2026" required style="text-transform: uppercase; font-weight: 700;">
          </div>
        </div>

        <div class="form-group">
          <label for="clientPassInput">Senha de Acesso</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="clientPassInput" placeholder="Sua senha" required>
          </div>
        </div>

        <button type="submit" class="btn-primary full-width" style="margin-top: 8px;">
          <i class="fa-solid fa-images"></i>
          <span>Acessar Meu Ensaio</span>
        </button>
      </form>
    </section>

    <!-- TELA DE GALERIA PRIVADA DO CLIENTE -->
    <section id="clientGallerySection" class="hidden">
      <div class="client-gallery-header">
        <div>
          <span id="clientEventDate" style="font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted);">ENSAIO EXCLUSIVO</span>
          <h2 id="clientGalleryTitle" style="font-family: var(--font-heading); font-size: 26px; font-weight: 800; color: #000; margin: 4px 0;">Galeria do Cliente</h2>
          <p id="clientWelcomeText" style="font-size: 13.5px; color: var(--text-secondary);">Olá! Confira e baixe suas fotos abaixo.</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <a id="clientExternalDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary hidden">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            <span>Baixar Pacote Completo (Alta Resolução)</span>
          </a>
          <button type="button" id="clientLogoutBtn" class="btn-sm btn-glass" style="cursor: pointer;">
            <i class="fa-solid fa-right-from-bracket" style="margin-right: 6px;"></i>
            <span>Sair</span>
          </button>
        </div>
      </div>

      <div id="clientPhotosGrid" class="client-photos-grid">
        <!-- Injected dynamically -->
      </div>
    </section>
  </div>

  <script type="module">
    import { getClientAccounts } from "./assets/js/firebase-config.js?v=4.9";

    const loginSection = document.getElementById("clientLoginSection");
    const gallerySection = document.getElementById("clientGallerySection");
    const loginForm = document.getElementById("clientLoginForm");
    const codeInput = document.getElementById("clientCodeInput");
    const passInput = document.getElementById("clientPassInput");
    const logoutBtn = document.getElementById("clientLogoutBtn");

    let accounts = [];

    async function init() {
      accounts = await getClientAccounts();
      const savedCode = sessionStorage.getItem("phmedia_client_code");
      if (savedCode) {
        const found = accounts.find(a => (a.accessCode || "").toUpperCase() === savedCode.toUpperCase());
        if (found) renderGallery(found);
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      accounts = await getClientAccounts();
      const rawAccess = codeInput.value.trim();
      const accessLower = rawAccess.toLowerCase();
      const pass = passInput.value.trim();

      const customAdminEmail = (localStorage.getItem("phmedia_custom_admin_email") || "").trim().toLowerCase();
      const customPin = localStorage.getItem("phmedia_custom_pin");
      const defaultAdmins = ["admin@phmedia.com", "admin", "pedro@phmedia.com", "phmedia"];
      if ((defaultAdmins.includes(accessLower) || (customAdminEmail && accessLower === customAdminEmail)) && (pass === "1234" || (customPin && pass === customPin))) {
        sessionStorage.setItem("phmedia_admin_auth", "true");
        window.location.href = "admin.html";
        return;
      }

      const match = accounts.find(
        a => (
          ((a.clientEmail || "").trim().toLowerCase() === accessLower && accessLower.length > 0) ||
          ((a.accessCode || "").trim().toLowerCase() === accessLower && accessLower.length > 0)
        ) && String(a.password || "") === pass
      );

      if (!match) {
        alert("E-mail/código ou senha inválidos. Verifique os dados enviados pelo Pedro.");
        return;
      }

      sessionStorage.setItem("phmedia_client_code", match.accessCode);
      renderGallery(match);
    });

    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("phmedia_client_code");
      gallerySection.classList.add("hidden");
      loginSection.classList.remove("hidden");
      codeInput.value = "";
      passInput.value = "";
    });

    function renderGallery(account) {
      loginSection.classList.add("hidden");
      gallerySection.classList.remove("hidden");

      document.getElementById("clientEventDate").textContent = account.eventDate || "ENSAIO EXCLUSIVO";
      document.getElementById("clientGalleryTitle").textContent = account.galleryTitle || "Seu Ensaio";
      document.getElementById("clientWelcomeText").textContent = `Olá, ${account.clientName}! Toque em qualquer foto para baixar.`;

      const extBtn = document.getElementById("clientExternalDownloadBtn");
      if (account.downloadUrl && account.downloadUrl.trim().length > 0) {
        extBtn.href = account.downloadUrl;
        extBtn.classList.remove("hidden");
      } else {
        extBtn.classList.add("hidden");
      }

      const grid = document.getElementById("clientPhotosGrid");
      const photos = Array.isArray(account.photos) ? account.photos : [];
      grid.innerHTML = photos.map((src, idx) => `
        <div class="client-photo-item">
          <img src="${src}" alt="Foto ${idx + 1}" loading="lazy">
          <div class="client-photo-actions">
            <a href="${src}" download="PHMedia-${(account.accessCode || 'Ensaio')}-${idx + 1}.jpg" class="btn-download-single">
              <i class="fa-solid fa-download"></i>
              <span>Baixar Foto #${idx + 1}</span>
            </a>
          </div>
        </div>
      `).join("");
    }

    init();
  </script>
</body>
</html>
